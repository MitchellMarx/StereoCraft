org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# MC 26.x requires Java 25 to build/run; default JAVA_HOME on this machine is JDK 21.
org.gradle.java.home=C:/jdk-25.0.1
# Loom is not yet config-cache compatible (FabricMC/fabric-loom#1349).
org.gradle.configuration-cache=false

