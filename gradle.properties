# Voxy: compile-only, ONLY to resolve the me.cortex.voxy.client.iris.* symbols that the
# (currently disabled) VoxyEyeRebindHooks references. The NeoForge-native voxy-neoforge
# build excludes its Iris integration, so no NeoForge jar ships these classes — we compile
