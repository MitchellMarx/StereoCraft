# matching FabricMC/fabric-example-mod @ 26.2); Minecraft-facing names are the
# real (Mojang) names. See build.gradle.kts.
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.154.1+26.2
sodium_version=mc26.2-0.9.0-fabric
iris_version=1.11.1+26.2-fabric
voxy_version=0.2.17-alpha

# Mod
