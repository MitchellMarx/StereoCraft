dependencies {
    // Angelica — pinned to the exact version the GTNH test instance runs. The
    // old floating [2.1,2.2) range silently moved to 2.1.61, which needs
    // GTNHLib 0.10+ (dev client refused to start) and differs from what
    // players run — mixin targets were being checked against the wrong jar.
    implementation("com.github.GTNewHorizons:Angelica:2.1.22:dev") { transitive = false }

    // GTNHLib — required; provides jvmDowngrader stubs at runtime.
    api("com.github.GTNewHorizons:GTNHLib:0.9.68:dev")  // = GTNH test instance

    // RetroFuturaBootstrap — compileOnly; provides launchClassLoader for LWJGL3 reflective
    // class loading in WindowsCursorBackend / CursorPresentThread. Matches sbs2's pattern
    // (dependencies.gradle line 71).
    compileOnly("com.gtnewhorizons.retrofuturabootstrap:RetroFuturaBootstrap:1.0.17") { transitive = false }

    // Dev-time conveniences (matches Angelica's pattern)
    compileOnly("org.projectlombok:lombok:1.18.42") { transitive = false }
    annotationProcessor("org.projectlombok:lombok:1.18.42")
    compileOnly("org.jetbrains:annotations:26.0.2")

    // Tests
    testImplementation("org.junit.jupiter:junit-jupiter:6.0.3")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}
